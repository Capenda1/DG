# Dádiva Go — nginx (HTTPS → Next BFF :3000)
#
# 1. Ajustar server_name e caminhos dos certificados (Certbot)
# 2. ln -s este ficheiro em /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
#
# A API Nest NÃO é publicada — o Next faz proxy via INTERNAL_API_URL.

upstream dadiva_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.seudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.seudominio.com;

    # ssl_certificate     /etc/letsencrypt/live/app.seudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.seudominio.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 30m;

    location / {
        proxy_pass http://dadiva_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
